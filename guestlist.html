<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>賓客名單 | Phil ♥ Jasmine 2026.09.12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF8F2;
    --paper:#FFFFFF;
    --gold:#B8975A;
    --gold-deep:#8F7440;
    --gold-pale:#F1E7D3;
    --ink:#2C2318;
    --ink-soft:#6B5D46;
    --line:#E9DFC9;
    --sage:#7A9070;
    --sage-pale:#E5EBE1;
    --rose:#B5654A;
    --rose-pale:#F3E3DE;
    --sky:#5C7B94;
    --sky-pale:#E1E9EE;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--cream);
    color:var(--ink);
  }

  /* ===== Header ===== */
  header{
    background:linear-gradient(160deg,#2C2318 0%,#3B2F1E 100%);
    color:var(--gold-pale);
    padding:38px 20px 26px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:'';
    position:absolute;
    top:-70%; left:50%;
    width:320px; height:320px;
    background:radial-gradient(circle, rgba(184,151,90,.20) 0%, transparent 70%);
    transform:translateX(-50%);
    pointer-events:none;
  }
  .monogram{
    font-family:"Noto Serif TC",serif;
    font-size:1rem;
    letter-spacing:7px;
    color:var(--gold);
    margin-bottom:10px;
    position:relative;
  }
  header h1{
    font-family:"Noto Serif TC",serif;
    margin:0 0 6px;
    font-size:1.7rem;
    font-weight:700;
    letter-spacing:1.5px;
    position:relative;
  }
  header .date{
    font-size:.76rem;
    letter-spacing:3px;
    color:var(--gold);
    opacity:.9;
    text-transform:uppercase;
    position:relative;
  }

  .grand-stats{
    display:flex;
    justify-content:center;
    gap:26px;
    margin:20px auto 0;
    max-width:760px;
    padding:0 16px;
    position:relative;
    z-index:2;
  }
  .grand-stats .gs{text-align:center;}
  .grand-stats .gs .n{
    font-family:"Noto Serif TC",serif;
    font-size:1.35rem;
    font-weight:700;
    color:var(--gold);
    display:block;
    line-height:1.1;
  }
  .grand-stats .gs .l{
    font-size:.66rem;
    color:var(--gold-pale);
    opacity:.72;
    letter-spacing:.5px;
    margin-top:2px;
    display:block;
  }

  /* ===== 篩選區（下拉為主） ===== */
  .filter-zone{
    max-width:760px;
    margin:0 auto;
    padding:20px 16px 0;
  }
  .zone-label{
    font-family:"Noto Serif TC",serif;
    font-size:.95rem;
    font-weight:700;
    color:var(--ink);
    margin-bottom:9px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .zone-label::before{content:'';width:5px;height:5px;background:var(--gold);border-radius:50%;}

  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .cat-card{
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:14px;
    padding:14px 14px 12px;
    cursor:pointer;
    box-shadow:0 4px 12px -8px rgba(44,35,24,.14);
    text-align:left;
  }
  .cat-card.active{
    border-color:var(--gold);
    background:linear-gradient(180deg,var(--gold-pale) 0%, var(--paper) 70%);
  }
  .cat-card.all-card{
    grid-column:1 / -1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
  }
  .cat-card.all-card .title{font-size:1.15rem;margin-bottom:0;}
  .cat-card .title{
    font-family:"Noto Serif TC",serif;
    font-size:1.05rem;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
    line-height:1.3;
  }
  .cat-card .mini-badges{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .cat-card .mini-badge{
    font-size:.66rem;
    padding:3px 7px;
    border-radius:6px;
    font-weight:700;
    white-space:nowrap;
  }
  .cat-card .mini-badge.adult{background:var(--gold-pale);color:var(--gold-deep);}
  .cat-card .mini-badge.kid{background:var(--sage-pale);color:var(--sage);}
  .cat-card .mini-badge.veg{background:var(--rose-pale);color:var(--rose);}
  .cat-card.all-card .mini-badges{flex-shrink:0;}

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:16px auto 4px;
    max-width:760px;
    color:var(--gold);
    padding:0 16px;
  }
  .divider::before,.divider::after{
    content:'';
    height:1px;
    flex:1;
    background:linear-gradient(90deg, transparent, var(--line));
  }
  .divider::after{background:linear-gradient(90deg, var(--line), transparent);}
  .divider .mark{font-size:.8rem;flex-shrink:0;}

  /* ===== Sticky search + quick filters ===== */
  .controls-wrap{
    position:sticky;
    top:0;
    z-index:30;
    background:var(--cream);
  }
  .controls-inner{
    max-width:760px;
    margin:0 auto;
    padding:10px 16px 12px;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .search-box svg{flex-shrink:0;opacity:.5;}
  .search-box input{
    border:none;
    outline:none;
    flex:1;
    font-size:.95rem;
    background:transparent;
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
  }
  .search-box input::placeholder{color:#B3A583;}

  .quick-row{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .qchip{
    padding:7px 13px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:.76rem;
    font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .qchip.active{
    border-color:var(--gold);
    background:var(--gold-pale);
    color:var(--gold-deep);
  }

  /* ===== List ===== */
  .list-wrap{
    max-width:760px;
    margin:0 auto;
    padding:14px 16px 60px;
  }
  .result-line{
    font-size:.8rem;
    color:var(--ink-soft);
    margin-bottom:16px;
    padding-bottom:11px;
    border-bottom:1px dashed var(--line);
  }
  .result-line b{color:var(--gold-deep);}

  .cat-block{margin-bottom:28px;}
  .cat-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:11px;
  }
  .cat-head .name{
    font-family:"Noto Serif TC",serif;
    font-size:1.12rem;
    font-weight:700;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:9px;
  }
  .cat-head .name::before{
    content:'';
    width:6px;height:6px;
    background:var(--gold);
    border-radius:50%;
  }
  .cat-head .meta{
    font-size:.74rem;
    color:var(--ink-soft);
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:15px 17px;
    margin-bottom:9px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .card .info{min-width:0;flex:1;}
  .card .name-row{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .card .seq{
    font-size:.68rem;
    color:#C4B696;
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  .card .name{
    font-size:1.02rem;
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .badges{
    display:flex;
    gap:5px;
    flex-shrink:0;
    flex-wrap:wrap;
    justify-content:flex-end;
    max-width:150px;
  }
  .badge{
    font-size:.7rem;
    padding:4px 10px;
    border-radius:8px;
    font-weight:700;
    white-space:nowrap;
  }
  .badge.adult{background:var(--gold-pale);color:var(--gold-deep);}
  .badge.kid{background:var(--sage-pale);color:var(--sage);}
  .badge.chair{background:var(--sky-pale);color:var(--sky);}
  .badge.veg{background:var(--rose-pale);color:var(--rose);}

  .empty{
    text-align:center;
    padding:70px 20px;
    color:#B3A583;
  }
  .empty .icon{font-size:2.2rem;margin-bottom:12px;}
  .empty .txt{font-size:.9rem;}

  footer{
    text-align:center;
    font-size:.72rem;
    color:#B3A583;
    padding:0 20px 34px;
    line-height:1.7;
  }
  footer .heart{color:var(--gold);}

  @media (min-width:640px){
    header h1{font-size:2rem;}
    .cat-grid{grid-template-columns:1fr 1fr 1fr;}
  }
</style>
</head>

let state = { search:'', cat:'ALL', quick:'ALL' };
const cats = [...new Set(GUEST_DATA.map(d=>d.cat))];

function renderCatGrid(){
  const grid = document.getElementById('catGrid');
  const allAdult = GUEST_DATA.reduce((a,d)=>a+d.adult,0);
  const allKid = GUEST_DATA.reduce((a,d)=>a+d.kid,0);
  const allVeg = GUEST_DATA.reduce((a,d)=>a+d.veg,0);
  let html = `<div class="cat-card all-card ${state.cat==='ALL'?'active':''}" data-cat="ALL">
    <div class="title">全部分類</div>
    <div class="mini-badges">
      <span class="mini-badge adult">大${allAdult}</span>
      <span class="mini-badge kid">小${allKid}</span>
      <span class="mini-badge veg">素${allVeg}</span>
    </div>
  </div>`;
  cats.forEach(c=>{
    const items = GUEST_DATA.filter(d=>d.cat===c);
    const adult = items.reduce((a,d)=>a+d.adult,0);
    const kid = items.reduce((a,d)=>a+d.kid,0);
    const veg = items.reduce((a,d)=>a+d.veg,0);
    html += `<div class="cat-card ${state.cat===c?'active':''}" data-cat="${c}">
      <div class="title">${c}</div>
      <div class="mini-badges">
        <span class="mini-badge adult">大${adult}</span>
        ${kid>0?`<span class="mini-badge kid">小${kid}</span>`:''}
        ${veg>0?`<span class="mini-badge veg">素${veg}</span>`:''}
      </div>
    </div>`;
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.cat-card').forEach(card=>{
    card.addEventListener('click',()=>{
      state.cat = card.dataset.cat;
      renderCatGrid();
      render();
      document.querySelector('.controls-wrap').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function renderGrandStats(){
  const totalAdult = GUEST_DATA.reduce((s,d)=>s+d.adult,0);
  const totalKid = GUEST_DATA.reduce((s,d)=>s+d.kid,0);
  const totalVeg = GUEST_DATA.reduce((s,d)=>s+d.veg,0);
  const totalChair = GUEST_DATA.reduce((s,d)=>s+d.chair,0);
  const stats = [
    {n:totalAdult+totalKid,l:'總人數'},
    {n:totalAdult,l:'大人'},
    {n:totalKid,l:'小孩'},
    {n:totalVeg,l:'素食'},
    {n:totalChair,l:'兒童椅'},
  ];
  document.getElementById('grandStats').innerHTML = stats.map(s=>
    `<div class="gs"><span class="n">${s.n}</span><span class="l">${s.l}</span></div>`
  ).join('');
}

const quickRow = document.getElementById('quickRow');
const quickOpts = [
  {key:'ALL', label:'全部'},
  {key:'VEG', label:'🥗 素食'},
  {key:'CHAIR', label:'🪑 兒童椅'},
  {key:'KID', label:'👶 有小孩'},
];
quickRow.innerHTML = quickOpts.map(o=>
  `<div class="qchip ${o.key==='ALL'?'active':''}" data-key="${o.key}">${o.label}</div>`
).join('');
quickRow.querySelectorAll('.qchip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    quickRow.querySelectorAll('.qchip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    state.quick = chip.dataset.key;
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', e=>{
  state.search = e.target.value.trim().toLowerCase();
  render();
});

function filterData(){
  return GUEST_DATA.filter(d=>{
    if(state.cat!=='ALL' && d.cat!==state.cat) return false;
    if(state.quick==='VEG' && d.veg<=0) return false;
    if(state.quick==='CHAIR' && d.chair<=0) return false;
    if(state.quick==='KID' && d.kid<=0) return false;
    if(state.search){
      if(!d.name.toLowerCase().includes(state.search)) return false;
    }
    return true;
  });
}

function render(){
  const filtered = filterData();
  const listArea = document.getElementById('listArea');
  const resultLine = document.getElementById('resultLine');

  const fAdult = filtered.reduce((s,d)=>s+d.adult,0);
  const fKid = filtered.reduce((s,d)=>s+d.kid,0);
  resultLine.innerHTML = `大人 <b>${fAdult}</b> 人 · 小孩 <b>${fKid}</b> 人`;

  if(filtered.length===0){
    listArea.innerHTML = `<div class="empty"><div class="icon">🔍</div><div class="txt">沒有符合的名單，換個關鍵字試試</div></div>`;
    return;
  }

  const groups = {};
  filtered.forEach(d=>{
    if(!groups[d.cat]) groups[d.cat]=[];
    groups[d.cat].push(d);
  });

  let html='';
  Object.keys(groups).forEach(cat=>{
    const items = groups[cat];
    const adultSum = items.reduce((s,d)=>s+d.adult,0);
    const kidSum = items.reduce((s,d)=>s+d.kid,0);
    html += `<div class="cat-block">
      <div class="cat-head">
        <div class="name">${cat}</div>
        <div class="meta">大人${adultSum}人${kidSum>0?` · 小孩${kidSum}人`:''}</div>
      </div>`;
    items.forEach(d=>{
      let badges = `<span class="badge adult">${d.adult}大</span>`;
      if(d.kid>0) badges += `<span class="badge kid">${d.kid}童</span>`;
      if(d.chair>0) badges += `<span class="badge chair">椅${d.chair}</span>`;
      if(d.veg>0) badges += `<span class="badge veg">素${d.veg}</span>`;
      html += `<div class="card">
        <div class="info">
          <div class="name-row"><span class="seq">#${d.seq}</span><span class="name">${d.name}</span></div>
        </div>
        <div class="badges">${badges}</div>
      </div>`;
    });
    html += `</div>`;
  });
  listArea.innerHTML = html;
}

renderGrandStats();
renderCatGrid();
render();
</script>
